<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
    .logo-mp {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      fill: #FFFFFF;
      font-size: 112px;
      letter-spacing: 1px;
    }
  </style>
  
  <!-- Outer Blue Background -->
  <rect width="1000" height="1000" rx="180" fill="#155DFC"/>

  <!-- Outer White Frame -->
  <rect x="87" y="87" width="826" height="826" rx="133" fill="none" stroke="#FFFFFF" stroke-width="70"/>

  <!-- Left Cabinet Door (Tall) -->
  <rect x="281" y="273" width="195" height="454" rx="22" fill="#FFFFFF"/>

  <!-- Right Cabinet Door (Short) -->
  <rect x="524" y="273" width="195" height="314" rx="22" fill="#FFFFFF"/>

  <!-- Right Text MP -->
  <text x="523" y="722" class="logo-mp">МП</text>
</svg>
