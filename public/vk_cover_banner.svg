<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1590 500" width="1590" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="35%" stop-color="#0f1f3d" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Glowing accents -->
    <radialGradient id="glow1" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Card Glassmorphism Gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1590" height="500" fill="url(#bg)" />
  <rect width="1590" height="500" fill="url(#glow1)" />
  <rect width="1590" height="500" fill="url(#glow2)" />

  <!-- Blueprint Tech Grid -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="1590" y2="50" stroke-dasharray="6,6" />
    <line x1="0" y1="125" x2="1590" y2="125" stroke-dasharray="6,6" />
    <line x1="0" y1="200" x2="1590" y2="200" stroke-dasharray="6,6" />
    <line x1="0" y1="275" x2="1590" y2="275" stroke-dasharray="6,6" />
    <line x1="0" y1="350" x2="1590" y2="350" stroke-dasharray="6,6" />
    <line x1="0" y1="425" x2="1590" y2="425" stroke-dasharray="6,6" />
    
    <line x1="200" y1="0" x2="200" y2="500" stroke-dasharray="6,6" />
    <line x1="450" y1="0" x2="450" y2="500" stroke-dasharray="6,6" />
    <line x1="700" y1="0" x2="700" y2="500" stroke-dasharray="6,6" />
    <line x1="950" y1="0" x2="950" y2="500" stroke-dasharray="6,6" />
    <line x1="1200" y1="0" x2="1200" y2="500" stroke-dasharray="6,6" />
    <line x1="1450" y1="0" x2="1450" y2="500" stroke-dasharray="6,6" />
  </g>

  <!-- ================= LEFT COLUMN: BRANDING & BENEFITS ================= -->

  <!-- Logo Group -->
  <g transform="translate(80, 52)">
    <!-- Blue App Squircle -->
    <rect width="64" height="64" rx="16" fill="#2563eb" filter="url(#shadow)" />
    <!-- White Cabinet Frame -->
    <rect x="16" y="16" width="32" height="32" rx="2" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />
    <!-- Left Column -->
    <rect x="22" y="22" width="8" height="20" rx="1" fill="#ffffff" />
    <!-- Right Column -->
    <rect x="34" y="22" width="8" height="12" rx="1" fill="#ffffff" />

    <!-- Brand Name -->
    <text x="82" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="1.5">МЕБЕЛЬ-ПЛАН</text>
    <text x="84" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" letter-spacing="1">ПРОФЕССИОНАЛЬНЫЙ СЕРВИС РАСЧЕТА</text>
  </g>

  <!-- Top Badge: Bitrix24 -->
  <g transform="translate(80, 140)">
    <rect width="320" height="32" rx="16" fill="url(#glass)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="18" cy="16" r="6" fill="#00aaff" />
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e0f2fe" letter-spacing="0.5">ОФИЦИАЛЬНОЕ ПРИЛОЖЕНИЕ БИТРИКС24</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 195)">
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff">
      Точный расчет мебели в CRM
    </text>
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="#60a5fa">
      за 3 минуты вместо часов
    </text>
  </g>

  <!-- 3 Key Feature Bullets -->
  <g transform="translate(80, 310)">
    <!-- Bullet 1 -->
    <g transform="translate(0, 0)">
      <circle cx="14" cy="14" r="14" fill="#2563eb" fill-opacity="0.5" stroke="#60a5fa" stroke-width="1.5" />
      <path d="M10 14l3 3 6-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="38" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
        Кухни, шкафы-купе, гардеробные: <tspan fill="#93c5fd">раскрой, кромка, фурнитура</tspan>
      </text>
    </g>

    <!-- Bullet 2 -->
    <g transform="translate(0, 42)">
      <circle cx="14" cy="14" r="14" fill="#2563eb" fill-opacity="0.5" stroke="#60a5fa" stroke-width="1.5" />
      <path d="M10 14l3 3 6-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="38" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
        Смета и красивое КП для клиента в PDF <tspan fill="#93c5fd">в один клик</tspan>
      </text>
    </g>

    <!-- Bullet 3 -->
    <g transform="translate(0, 84)">
      <circle cx="14" cy="14" r="14" fill="#2563eb" fill-opacity="0.5" stroke="#60a5fa" stroke-width="1.5" />
      <path d="M10 14l3 3 6-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="38" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f1f5f9">
        Автоматическая выгрузка позиций <tspan fill="#93c5fd">в товары сделки Битрикс24</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom CTA ribbon -->
  <g transform="translate(80, 435)">
    <rect width="210" height="34" rx="8" fill="#2563eb" />
    <text x="105" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.5">14 ДНЕЙ ТЕСТ-ДРАЙВ</text>
    <text x="235" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#bfdbfe">Подходит для фабрик, цехов и салонов • mebel-plan.ru</text>
  </g>


  <!-- ================= RIGHT COLUMN: INTERACTIVE VISUAL DEMO ================= -->

  <!-- Big CRM Dashboard Card -->
  <g transform="translate(890, 60)" filter="url(#shadow)">
    <!-- Main Window Frame -->
    <rect width="620" height="380" rx="18" fill="url(#glassCard)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2" />

    <!-- Window Top Header Bar -->
    <path d="M0 18 Q0 0 18 0 L602 0 Q620 0 620 18 L620 48 L0 48 Z" fill="#0f172a" fill-opacity="0.9" />
    <line x1="0" y1="48" x2="620" y2="48" stroke="#334155" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="24" r="5" fill="#ef4444" />
    <circle cx="42" cy="24" r="5" fill="#f59e0b" />
    <circle cx="60" cy="24" r="5" fill="#10b981" />
    <text x="84" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Сделка #2841: Кухня угловая «Модерн» — Мебель-План</text>

    <!-- Deal Status Badge -->
    <rect x="500" y="14" width="102" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="551" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399">В РАСЧЕТЕ</text>

    <!-- Inside Content Split -->
    <!-- Left Inside: 3D Furniture Blueprint Preview -->
    <g transform="translate(24, 66)">
      <!-- Blueprint Box -->
      <rect width="280" height="210" rx="12" fill="#091326" stroke="#1e3a8a" stroke-width="1.5" />
      
      <!-- Tech Grid Inside Box -->
      <line x1="0" y1="70" x2="280" y2="70" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="0" y1="140" x2="280" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="93" y1="0" x2="93" y2="210" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="186" y1="0" x2="186" y2="210" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />

      <!-- Isometric / Front Kitchen Visual -->
      <!-- Countertop Base -->
      <rect x="25" y="105" width="230" height="85" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
      <!-- Countertop Line -->
      <rect x="20" y="100" width="240" height="10" rx="2" fill="#38bdf8" />
      <!-- Lower Modules (Drawers & Doors) -->
      <line x1="102" y1="110" x2="102" y2="190" stroke="#3b82f6" stroke-width="1.5" />
      <line x1="178" y1="110" x2="178" y2="190" stroke="#3b82f6" stroke-width="1.5" />
      <!-- Drawers lines in module 1 -->
      <line x1="25" y1="136" x2="102" y2="136" stroke="#475569" stroke-width="1.5" />
      <line x1="25" y1="162" x2="102" y2="162" stroke="#475569" stroke-width="1.5" />
      <!-- Handles -->
      <rect x="50" y="120" width="26" height="3" rx="1.5" fill="#ffffff" />
      <rect x="50" y="146" width="26" height="3" rx="1.5" fill="#ffffff" />
      <rect x="50" y="172" width="26" height="3" rx="1.5" fill="#ffffff" />
      <rect x="110" y="125" width="3" height="24" rx="1.5" fill="#ffffff" />
      <rect x="190" y="125" width="3" height="24" rx="1.5" fill="#ffffff" />

      <!-- Upper Cabinets -->
      <rect x="25" y="25" width="230" height="55" rx="4" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="0" />
      <line x1="102" y1="25" x2="102" y2="80" stroke="#60a5fa" stroke-width="1.5" />
      <line x1="178" y1="25" x2="178" y2="80" stroke="#60a5fa" stroke-width="1.5" />
      <!-- Integrated LED bar -->
      <line x1="26" y1="81" x2="254" y2="81" stroke="#38bdf8" stroke-width="3" />

      <!-- Dimension Tags -->
      <text x="140" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Ш: 2800 мм</text>
      <text x="268" y="60" text-anchor="start" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#94a3b8">В: 720</text>
      <text x="268" y="150" text-anchor="start" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#94a3b8">В: 850</text>
    </g>

    <!-- Right Inside: Calculation Breakdown -->
    <g transform="translate(325, 66)">
      <!-- Price Summary Block -->
      <rect width="270" height="85" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">ИТОГОВАЯ СТОИМОСТЬ СМЕТЫ</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#38bdf8">194 850 ₽</text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#10b981">✓ Наценка и маржинальность 38%</text>

      <!-- Materials List Breakdown -->
      <g transform="translate(0, 98)">
        <!-- Row 1 -->
        <rect width="270" height="32" rx="6" fill="#0f172a" fill-opacity="0.6" />
        <circle cx="14" cy="16" r="4" fill="#38bdf8" />
        <text x="26" y="20" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">ЛДСП Egger 16 мм (4.2 л.)</text>
        <text x="254" y="20" text-anchor="end" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">28 500 ₽</text>

        <!-- Row 2 -->
        <rect y="36" width="270" height="32" rx="6" fill="#0f172a" fill-opacity="0.6" />
        <circle cx="14" cy="52" r="4" fill="#818cf8" />
        <text x="26" y="56" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Фасады МДФ Эмаль Soft-Touch</text>
        <text x="254" y="56" text-anchor="end" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">64 200 ₽</text>

        <!-- Row 3 -->
        <rect y="72" width="270" height="32" rx="6" fill="#0f172a" fill-opacity="0.6" />
        <circle cx="14" cy="88" r="4" fill="#f59e0b" />
        <text x="26" y="92" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Фурнитура Blum (доводчики, петли)</text>
        <text x="254" y="92" text-anchor="end" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">41 150 ₽</text>
      </g>
    </g>

    <!-- Bottom Action Bar inside Card -->
    <g transform="translate(24, 298)">
      <rect width="572" height="60" rx="10" fill="#091326" stroke="#1e3a8a" stroke-width="1" />

      <!-- Button: Export to CRM Deal -->
      <g transform="translate(16, 12)">
        <rect width="260" height="36" rx="8" fill="#2563eb" />
        <text x="130" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">⚡ ПЕРЕНЕСТИ В СДЕЛКУ CRM</text>
      </g>

      <!-- Button: Download PDF Offer -->
      <g transform="translate(292, 12)">
        <rect width="264" height="36" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
        <text x="132" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#60a5fa">📄 СКАЧАТЬ КП ДЛЯ КЛИЕНТА (PDF)</text>
      </g>
    </g>
  </g>
</svg>
