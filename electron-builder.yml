appId: com.mebelplan.erp.edgeserver
productName: ERP Ceh-Server
copyright: Copyright © 2026
directories:
  output: release
  buildResources: public
files:
  - electron/**/*
  - dist-electron/**/*
  - public/logo-64.png
  - public/icon-1024.png
  - package.json
  - "!**/node_modules/**"
asarUnpack:
  - dist-electron/**/*
  - public/**/*
extraResources:
  - from: src/services/permanentSeed.json
    to: permanentSeed.json
  - from: dist
    to: dist
win:
  icon: public/icon-1024.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ERP Ceh-Server
  artifactName: ERP-Ceh-Setup-${version}.exe
portable:
  artifactName: ERP-Ceh-Portable-${version}.exe
